[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamfetch"
version = "0.1.0"
description = "Download videos from YouTube, TikTok, and many other platforms — CLI and web app."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joshua Nignamon", email = "joshuanignamon52@gmail.com" }]
keywords = ["youtube", "tiktok", "downloader", "yt-dlp", "video", "cli", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "yt-dlp>=2024.11.18",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
streamfetch = "streamfetch.cli:main"

[project.urls]
Homepage = "https://github.com/Josh-cyber-pixel/streamfetch"
Repository = "https://github.com/Josh-cyber-pixel/streamfetch"
Issues = "https://github.com/Josh-cyber-pixel/streamfetch/issues"

[tool.setuptools.packages.find]
include = ["streamfetch*"]

[tool.setuptools.package-data]
"streamfetch.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
